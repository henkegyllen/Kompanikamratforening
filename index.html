<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>333 · Kompanimiddagen</title>
<meta name="description" content="Bordshäftet från 333. Hemvärnsinsatskompaniets kompanimiddag – test, ordlista, gnällmall och mer.">
<meta name="theme-color" content="#3b4a3e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#3b4a3e; --card:#46574a; --card2:#506252; --line:#d8d4c4;
  --text:#f2f0e7; --muted:#d8d4c4; --yellow:#c9bb3e; --ink:#1f2a20;
  --ok:#8fc47a; --bad:#e58b6f; --r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow Condensed',system-ui,sans-serif;font-size:18px;line-height:1.35;-webkit-text-size-adjust:100%}
h1,h2,h3,.osw{font-family:'Oswald',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
a{color:var(--yellow)}
button{font:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header.hero{padding:40px 0 22px;text-align:center}
.hero .kicker{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:40px;line-height:1.05;margin:6px 0 8px}
.hero p{margin:0;color:var(--muted);font-weight:600}
