<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Kajsas tal</title>
<!--
  KAJSAS TAL – fullskärmspresentation i bordshäftets färger och typsnitt.
  Bläddra: klick, mellanslag, → / PageDown (fjärrkontroll). Tillbaka: ← / PageUp. F = fullskärm. Home = början.
  Varje tryck tar nästa steg. Bilderna ligger i samma mapp som den här filen (kajsas-tal/ i repot).
  Synpunkter och åtgärder i utvärderingen ändras i listorna SYNP och ATG längst ner.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2c3a2f;--panel:#3b4a3e;--panel2:#46574a;--text:#f2f0e7;--muted:#d8d4c4;
  --yellow:#c9bb3e;--ink:#1f2a20;--line:rgba(216,212,196,.3);--red:#d42a1e;
  --osw:"Oswald","Bahnschrift Condensed","Arial Narrow",sans-serif;
  --bar:"Barlow Condensed","Bahnschrift SemiCondensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--bar);-webkit-font-smoothing:antialiased}
body.tyst{cursor:none}
.slide{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.slide.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.eyebrow{font-family:var(--osw);font-weight:600;font-size:max(13px,1.05vw);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.utan-anim,.utan-anim *{transition:none!important;animation:none!important}

/* ---------- 1 · Utvärdering ---------- */
#s-utv{padding:4.5vh 4vw 4vh;display:flex;flex-direction:column}
.utv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:3vw;margin-bottom:3.2vh}
.utv-head h1{font-family:var(--osw);font-weight:700;text-transform:uppercase;font-size:5.4vw;line-height:.95;letter-spacing:.01em}
.utv-antal{text-align:right;font-weight:700;font-size:1.6vw;color:var(--muted)}
.utv-antal b{display:block;font-family:var(--osw);font-size:4.6vw;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums}
.utv-body{flex:1;display:grid;grid-template-columns:1fr 27vw;gap:9vw;min-height:0}
.synp{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.6vh 1.4vw;min-height:0}
.kort{background:var(--panel);border-left:.45vw solid var(--yellow);border-radius:.6vw;padding:1.1vh 1vw;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 .6vh 1.6vh rgba(0,0,0,.28);opacity:0;transform:translateY(2vh) rotate(var(--rot)) scale(.92);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1.3)}
.kort.on{opacity:1;transform:translate(var(--dx),0) rotate(var(--rot))}
.kort q{font-weight:600;font-size:1.32vw;line-height:1.18;quotes:"”" "”"}
.kort small{margin-top:.5vh;font-size:.9vw;font-weight:600;color:var(--muted);letter-spacing:.03em}
.atg{display:flex;flex-direction:column;min-height:0}
.atg h2{font-family:var(--osw);font-weight:700;text-transform:uppercase;font-size:2.6vw;letter-spacing:.02em;border-bottom:.35vw solid var(--yellow);padding-bottom:.6vh;margin-bottom:1.6vh}
.atg ol{list-style:none;counter-reset:a;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.atg li{counter-increment:a;position:relative;padding:.9vh 1vw .9vh 3.4vw;font-weight:700;font-size:1.75vw;line-height:1.15;border-radius:.6vw;
  opacity:.12;transition:opacity .4s ease,background .4s ease,transform .4s ease}
.atg li::before{content:counter(a);position:absolute;left:.7vw;top:50%;transform:translateY(-50%);width:2vw;height:2vw;border-radius:50%;background:var(--yellow);color:var(--ink);
  font-family:var(--osw);font-size:1.1vw;display:flex;align-items:center;justify-content:center}
.atg li.on{opacity:1}
.atg li.topp.on{background:var(--yellow);color:var(--ink)}
.atg li.topp::before{background:var(--ink);color:var(--yellow)}
.pilar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pilar path{fill:none;stroke-linecap:round}
.pilar .pil{stroke:var(--yellow);stroke-width:max(2px,.17vw);opacity:.85}
.pilar .pil.ljus{stroke:var(--text);opacity:.7}
.pilar .spets{stroke:none;fill:var(--yellow);opacity:0}
.pilar .spets.ljus{fill:var(--text)}
.pilar.ritar .pil{animation:rita .62s cubic-bezier(.4,0,.2,1) backwards}
.pilar.ritar .spets{animation:spets .2s ease-out forwards}
.pilar.klar .spets{opacity:.9}
@keyframes rita{from{stroke-dashoffset:var(--len)}}
@keyframes spets{to{opacity:.9}}

/* ---------- 2 · Målbild ---------- */
#s-mal{display:grid;grid-template-columns:42vw 1fr;align-items:center;gap:4vw;padding:0 6vw}
.mal-txt{font-family:var(--osw);font-weight:700;text-transform:uppercase;font-size:9.6vw;line-height:.9;letter-spacing:.005em;color:var(--yellow);
  opacity:0;transform:translateX(-4vw);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.mal-txt small{display:block;font-family:var(--bar);font-weight:600;font-size:1.7vw;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:2.4vh}
.mal-bild{border:.5vw solid var(--text);border-radius:.6vw;box-shadow:0 2.4vh 6vh rgba(0,0,0,.45);overflow:hidden;
  opacity:0;transform:scale(.94) rotate(1.2deg);transition:opacity .8s ease .15s,transform 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.mal-bild img{display:block;width:100%;height:auto}
#s-mal.on .mal-txt{opacity:1;transform:none}
#s-mal.on .mal-bild{opacity:1;transform:rotate(1.2deg)}

/* ---------- 3 · Blå rummet ---------- */
#s-bla{overflow:hidden;background:#000}
#s-bla .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pers{position:absolute;bottom:0;opacity:0;transform:translateY(35%);transition:opacity .55s ease,transform .8s cubic-bezier(.2,.9,.3,1.15)}
.pers.in{opacity:1;transform:none}
.pers.mitt{left:50%;transform:translate(-50%,35%)}
.pers.mitt.in{transform:translateX(-50%)}
.pers.byt{transform:none;transition:opacity .9s ease}   /* tar plats genom att tona in, drottningen tonar över i Vickan */
.pers .fig{position:relative;height:100%;transform-origin:50% 100%}
.pers img{display:block;height:100%;width:auto;filter:drop-shadow(0 1.5vh 3vh rgba(0,0,0,.5))}
.pers .fig.faller{animation:faller 1.25s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes faller{   /* vacklar bakåt, faller sedan framåt mot publiken och ut ur bild */
  0%{transform:perspective(1600px) rotateX(0)}
  14%{transform:perspective(1600px) rotateX(7deg)}
  100%{transform:perspective(1600px) rotateX(-92deg) translateY(25%);opacity:0}
}
.hoger{right:3vw;height:64vh}
.kung.hoger{height:54vh}
.vanster{left:4vw;height:50vh}
.mitt{height:62vh}
.streck{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.streck line{stroke:var(--red);stroke-width:2.2vh;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.streck.dras line{transition:stroke-dashoffset .45s cubic-bezier(.6,0,.3,1)}
.streck.on line{stroke-dashoffset:0}

/* ---------- reglage ---------- */
.fs{position:fixed;top:1.4vh;right:1vw;z-index:5;font:600 14px var(--bar);color:var(--text);background:rgba(31,42,32,.7);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer;transition:opacity .4s ease}
body.tyst .fs{opacity:0;pointer-events:none}
</style>
</head>
<body>

<section class="slide" id="s-utv" aria-label="Utvärdering">
  <header class="utv-head">
    <div>
      <div class="eyebrow">333 · Förra kompanimiddagen</div>
      <h1>Utvärdering</h1>
    </div>
    <div class="utv-antal"><b id="antal">0</b>inkomna synpunkter</div>
  </header>
  <div class="utv-body">
    <div class="synp" id="synp"></div>
    <div class="atg"><h2>Åtgärder</h2><ol id="atg"></ol></div>
  </div>
  <svg class="pilar" id="pilar" aria-hidden="true"></svg>
</section>

<section class="slide" id="s-mal" aria-label="Målbild">
  <h1 class="mal-txt">Målbild</h1>
  <figure class="mal-bild"><img src="malbild.png" alt=""></figure>
</section>

<section class="slide" id="s-bla" aria-label="Blå rummet">
  <img class="bg" src="bla_rummet.png" alt="">
  <div class="pers hoger kung" id="p-kung"><div class="fig"><img src="kungen.png" alt=""></div></div>
  <div class="pers hoger byt" id="p-drottning"><div class="fig"><img src="drottning_viktoria.png" alt=""></div></div>
  <div class="pers hoger byt" id="p-vickan"><div class="fig"><img src="vickan.png" alt=""></div></div>
  <div class="pers vanster" id="p-estelle"><div class="fig"><img src="estelle.png" alt=""></div></div>
  <div class="pers mitt" id="p-daniel"><div class="fig"><img src="daniel.png" alt="">
    <svg class="streck" id="streck" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="8" y1="88" x2="92" y2="14" pathLength="100"/></svg></div></div>
</section>

<button class="fs" id="fs" type="button">Fullskärm (F)</button>

<script>
'use strict';
// ---------- Utvärderingen: synpunkter (text, avsändare, vilka åtgärder pilarna går till) och åtgärder ----------
const ATG = ['Större lokal','Bättre mat – och mer kaffe','Kortare tal','Finare gäster','Levande musik','Mindre regn','Ingen åtgärd möjlig','Ny målbild tas fram'];
const SYNP = [
  ['För trångt vid baren.','Soldat, 2:a pluton',[0,7]],
  ['Kön till toaletten var längre än en KFÖ.','Anhörig, bord 6',[0,7]],
  ['Lokalen luktade 20-tält.','Anhörig, bord 2',[0,6]],
  ['Maten smakade ration.','Kokgruppen (anonymt)',[1,7]],
  ['Kaffet tog slut 21:04.','UH-bef',[1,7]],
  ['Efterrätten kom före förrätten.','Anhörig, bord 4',[1]],
  ['KC:s tal var 47 minuter.','Samtliga',[2,7]],
  ['Tre tal handlade om regn.','Anhörig, bord 1',[2,5]],
  ['Min soldat sa ”kom” efter varje mening.','Anhörig, bord 5',[6]],
  ['Ingen kunglighet närvarade.','Svärmor',[3,7]],
  ['Bordsgrannen bokstaverade sitt namn.','Anhörig, bord 3',[3,6]],
  ['Ingen dansade.','Troppen',[4,7]],
  ['Musiken var en radio på brus.','Sambandsapa',[4]],
  ['Det regnade. Inomhus.','2-funktionen',[5,6]],
  ['Min soldat packade bilen i två timmar.','Anhörig, bord 7',[6]],
  ['Sämsta middagen sedan förra året.','Soldat, 3:e pluton',[7]],
  ['Vi vill ha mer av allt.','Hela kompaniet',[0,1,3,4,7]],
  ['Gnäll.','Samtliga soldater',[6,7]]
];
const ANTAL = 1312;   // ”inkomna synpunkter” som räknas upp

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random()*(b - a);
const svgNS = 'http://www.w3.org/2000/svg';
const timers = [];
let raf = 0;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function rensa(){ timers.splice(0).forEach(clearTimeout); cancelAnimationFrame(raf); }

// kort och åtgärder
const kort = SYNP.map(([t, av]) => {
  const d = document.createElement('div'); d.className = 'kort';
  d.style.setProperty('--rot', rnd(-2.6, 2.6).toFixed(2) + 'deg'); d.style.setProperty('--dx', rnd(-.6, .6).toFixed(2) + 'vw');
  const q = document.createElement('q'); q.textContent = t; const s = document.createElement('small'); s.textContent = '– ' + av;
  d.append(q, s); $('synp').appendChild(d); return d;
});
const atg = ATG.map((t, i) => { const li = document.createElement('li'); li.textContent = t; if (i === ATG.length - 1) li.className = 'topp'; $('atg').appendChild(li); return li; });

// pilarna: en böjd pil per koppling synpunkt → åtgärd, lite slumpad så att det blir rörigt
let pilData = null;
function byggPilar(){
  const svg = $('pilar'), box = svg.getBoundingClientRect(); svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  const P = [];
  SYNP.forEach(([, , mal], i) => mal.forEach(j => P.push([i, j])));
  if (!pilData || pilData.length !== P.length) pilData = P.map(() => ({ys: rnd(.25, .75), ye: rnd(-.28, .28), c1: rnd(.25, .65), c2: rnd(.3, .7), bo: rnd(-.12, .12), ljus: Math.random() < .3}));
  P.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return P.map(([i, j], k) => {
    const a = kort[i].getBoundingClientRect(), b = atg[j].getBoundingClientRect(), r = pilData[k];
    const sx = a.right - box.left - 4, sy = a.top - box.top + a.height*r.ys, ex = b.left - box.left - 8, ey = b.top - box.top + b.height*(.5 + r.ye), dx = ex - sx;
    const c1x = sx + dx*r.c1, c1y = sy + (ey - sy)*r.bo, c2x = ex - dx*(1 - r.c2), c2y = ey;
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', `M${sx.toFixed(1)} ${sy.toFixed(1)} C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`);
    p.setAttribute('class', 'pil' + (r.ljus ? ' ljus' : '')); svg.appendChild(p);
    const len = p.getTotalLength(); p.style.setProperty('--len', len.toFixed(1)); p.style.strokeDasharray = len.toFixed(1);
    const ang = Math.atan2(ey - c2y, ex - c2x), s = Math.max(9, innerWidth*.0075);   // spetsen följer kurvans riktning i slutet
    const h = document.createElementNS(svgNS, 'path');
    const pt = (u, v) => `${(ex + u*Math.cos(ang) - v*Math.sin(ang)).toFixed(1)} ${(ey + u*Math.sin(ang) + v*Math.cos(ang)).toFixed(1)}`;
    h.setAttribute('d', `M${pt(s*.4, 0)} L${pt(-s, -s*.62)} L${pt(-s*.55, 0)} L${pt(-s, s*.62)} Z`);
    h.setAttribute('class', 'spets' + (r.ljus ? ' ljus' : '')); svg.appendChild(h);
    return {p, h, j, k};
  });
}

function visaUtv(steg, anim){
  rensa();
  const svg = $('pilar'), n = $('antal');
  if (steg === 0 || !anim) {
    svg.innerHTML = ''; svg.classList.remove('ritar', 'klar');
    atg.forEach(li => li.classList.toggle('on', steg >= 1));
  }
  // steg 0: synpunkterna väller in och antalet räknas upp
  if (anim && steg === 0) {
    kort.forEach(k => k.classList.remove('on'));
    kort.forEach((k, i) => later(() => k.classList.add('on'), 250 + i*85));
    const t0 = performance.now(), dur = 250 + SYNP.length*85 + 400;
    (function tick(){ const p = Math.min(1, (performance.now() - t0)/dur); n.textContent = Math.round(ANTAL*(1 - Math.pow(1 - p, 3))).toLocaleString('sv-SE'); if (p < 1) raf = requestAnimationFrame(tick); })();
  } else {
    kort.forEach(k => k.classList.add('on')); n.textContent = ANTAL.toLocaleString('sv-SE');
  }
  // steg 1: pilarna ritas, en i taget men tätt, och åtgärderna tänds när första pilen når fram
  if (steg >= 1) {
    const pilar = byggPilar();
    if (anim) {
      svg.classList.add('ritar'); atg.forEach(li => li.classList.remove('on'));
      const forst = {};
      pilar.forEach((o, i) => {
        const d = i*70; o.p.style.animationDelay = d + 'ms'; o.h.style.animationDelay = (d + 560) + 'ms';
        if (forst[o.j] == null) forst[o.j] = d + 560;
      });
      Object.keys(forst).forEach(j => later(() => atg[j].classList.add('on'), forst[j]));
      later(() => { svg.classList.remove('ritar'); svg.classList.add('klar'); }, pilar.length*70 + 900);
    } else svg.classList.add('klar');
  }
}

// ---------- Blå rummet ----------
const P = {kung: $('p-kung'), drottning: $('p-drottning'), vickan: $('p-vickan'), estelle: $('p-estelle'), daniel: $('p-daniel')};
function stall(el, in_){ el.classList.toggle('in', in_); el.querySelector('.fig').classList.remove('faller'); }
function fall(el, anim){
  const f = el.querySelector('.fig');
  if (!anim) { el.classList.remove('in'); return; }
  // när fallet är klart göms figuren direkt, utan övertoning, så att den aldrig syns upprätt igen
  const klar = () => { el.classList.add('utan-anim'); el.classList.remove('in'); f.classList.remove('faller'); void el.offsetWidth; el.classList.remove('utan-anim'); };
  f.classList.remove('faller'); void f.offsetWidth; f.classList.add('faller');
  f.addEventListener('animationend', klar, {once: true});
}
function visaBla(steg, anim){
  rensa();
  const s = $('streck');
  // läget som gäller för steget; vid ”bakåt” sätts allt direkt utan rörelse
  if (!anim) document.body.classList.add('utan-anim');
  stall(P.kung, steg === 1 || (anim && steg === 2));
  stall(P.drottning, steg === 2 && !anim);
  stall(P.vickan, steg >= 3);
  stall(P.estelle, steg >= 4);
  stall(P.daniel, steg === 5 || (anim && steg === 6));
  s.classList.remove('dras', 'on');
  if (!anim) { void document.body.offsetWidth; document.body.classList.remove('utan-anim'); }
  if (anim && steg === 2) { fall(P.kung, true); later(() => P.drottning.classList.add('in'), 650); }   // kungen faller, drottningen tar platsen
  if (anim && steg === 3) P.drottning.classList.remove('in');                                     // drottningen tonar över i Vickan
  if (anim && steg === 6) {                                                                      // rött streck, sedan faller Daniel
    void s.offsetWidth; s.classList.add('dras', 'on');
    later(() => fall(P.daniel, true), 800);
  }
}

// ---------- bildspelet ----------
const SL = [
  {el: $('s-utv'), steg: 2, visa: visaUtv},
  {el: $('s-mal'), steg: 1, visa: () => {}},
  {el: $('s-bla'), steg: 7, visa: visaBla}
];
let si = -1, st = 0;
function go(nsi, nst, anim){
  if (nsi !== si) { SL.forEach((s, k) => s.el.classList.toggle('on', k === nsi)); si = nsi; }
  st = nst; rensa(); SL[si].visa(st, anim);
  try { history.replaceState(null, '', '#' + (si + 1) + '.' + st); } catch (e) {}
}
function nasta(){ if (st < SL[si].steg - 1) go(si, st + 1, true); else if (si < SL.length - 1) go(si + 1, 0, true); }
function forra(){ if (st > 0) go(si, st - 1, false); else if (si > 0) go(si - 1, SL[si - 1].steg - 1, false); }
addEventListener('keydown', e => {
  if ([' ', 'ArrowRight', 'ArrowDown', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); nasta(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); forra(); }
  else if (e.key === 'Home') { e.preventDefault(); go(0, 0, true); }
  else if (e.key === 'f' || e.key === 'F') helskarm();
});
addEventListener('click', e => { if (e.target.closest('.fs')) return; nasta(); });
addEventListener('contextmenu', e => { e.preventDefault(); forra(); });   // högerklick = tillbaka
function helskarm(){ try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }
$('fs').addEventListener('click', helskarm);
let tyst = 0;
addEventListener('mousemove', () => { document.body.classList.remove('tyst'); clearTimeout(tyst); tyst = setTimeout(() => document.body.classList.add('tyst'), 2200); });
tyst = setTimeout(() => document.body.classList.add('tyst'), 2200);
addEventListener('resize', () => { if (si === 0 && st >= 1) visaUtv(st, false); });

// start: #bild.steg i adressen, annars första bilden
{ const m = location.hash.match(/^#(\d+)\.(\d+)$/), a = m ? Math.min(SL.length, Math.max(1, +m[1])) - 1 : 0, b = m ? Math.min(SL[a].steg - 1, +m[2]) : 0;
  const start = () => go(a, b, !m);
  document.fonts && document.fonts.ready ? document.fonts.ready.then(start) : start(); }
</script>
</body>
</html>
