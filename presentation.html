<title>Från soldat till hemvärnet</title>
<style>
:root{
--bg:#2c3a2f;--panel:#3b4a3e;--panel2:#46574a;--text:#f2f0e7;--muted:#d8d4c4;
--yellow:#c9bb3e;--ink:#1f2a20;--line:rgba(216,212,196,.3);--own:#d4a017;
}
:root{color-scheme:only light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:"Barlow Condensed",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.eyebrow{font-family:"Oswald",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em}
#map{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:pan-y}
.cap{position:fixed;left:32px;top:28px;width:min(600px,calc(100vw - 64px));background:var(--panel);color:var(--text);
border-radius:14px;padding:16px 20px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .35s ease}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.12em;color:var(--yellow)}
.cap h1{font-size:clamp(1.6rem,2.4vw,2.3rem);line-height:1.08;margin-top:2px}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:6px}
.num{font-family:"Oswald",sans-serif;font-size:clamp(2rem,3vw,2.8rem);font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
.what{font-weight:700;font-size:1.15rem}
.calc{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.cap p{margin-top:6px;line-height:1.35;color:var(--muted);font-size:1.1rem;font-weight:500}
.fade{transition:opacity .2s ease}
.cap.swap .fade{opacity:0}
.kort{position:fixed;right:32px;top:calc(50% - 30px);width:min(720px,58vw);max-height:calc(100vh - 180px);overflow:auto;background:var(--panel);color:var(--text);
border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);padding:36px 44px 30px;
opacity:0;transform:translate(40px,-50%);pointer-events:none;transition:opacity .5s ease,transform .5s ease}
.kort.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.kort h2{font-size:clamp(1.7rem,2.6vw,2.4rem);line-height:1.08;margin:4px 0 10px}
.kort .ingress{font-size:1.2rem;line-height:1.4;color:var(--muted);font-weight:500;margin-bottom:18px}
.kort ol{list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.kort ol li{counter-increment:p;position:relative;padding-left:46px;font-size:1.3rem;line-height:1.35;font-weight:500}
.kort ol li::before{content:counter(p);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--yellow);
color:var(--ink);font-family:"Oswald",sans-serif;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.kort ol li b{color:var(--yellow);font-weight:700}
.kort .utover{border-top:2px solid var(--line);padding-top:16px}
.kort .utover h3{font-size:1rem;letter-spacing:.08em;color:var(--yellow);margin-bottom:10px}
.kort .utover ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.kort .utover li{position:relative;padding-left:24px;font-size:1.2rem;line-height:1.35;font-weight:500;transition:opacity .45s ease,transform .45s ease}
.kort .utover li::before{content:'';position:absolute;left:4px;top:.5em;width:10px;height:10px;border-radius:2px;background:var(--yellow)}
.kort .utover li.ut{opacity:0;transform:translateX(18px)}
.kort [hidden]{display:none!important}
.kort .roller{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kort .roll{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;transition:background .35s ease,border-color .35s ease}
.kort .roll h4{display:flex;align-items:center;gap:8px;font-size:1.1rem;margin-bottom:4px}
.kort .roll canvas{width:28px;height:24px;flex:none;background:#f6f4ec;border-radius:6px}
.kort .roll p{font-size:1.05rem;line-height:1.35;color:var(--muted);font-weight:500}
.kort .roll.aktiv{border-color:var(--yellow);background:#4c5d47}
.kort .nastaRoll{display:inline-flex;align-items:center;min-height:46px;margin-top:16px;font:inherit;font-size:1.1rem;font-weight:700;color:var(--ink);background:var(--yellow);border:0;border-radius:12px;padding:8px 18px;cursor:pointer}
.kort .fot{margin-top:14px;font-size:1.05rem;color:var(--muted);font-style:italic}
.cap.gone,.legend.gone{opacity:0;pointer-events:none}
.legend{position:fixed;left:32px;bottom:26px;max-width:calc(100vw - 560px);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;
background:var(--panel);border-radius:12px;padding:7px 14px;font-size:.98rem;font-weight:600;color:var(--text);transition:opacity .35s ease}
.legend .it{display:flex;align-items:center;gap:6px}
.legend [hidden]{display:none!important}
.legend canvas{width:28px;height:24px;background:#f6f4ec;border-radius:6px}
.legend .ech{font-weight:700;color:var(--yellow);letter-spacing:.08em;min-width:16px;text-align:center}
.legend .sep{width:2px;height:18px;background:var(--line)}
.nav{position:fixed;right:28px;bottom:26px;display:flex;align-items:center;gap:8px;background:var(--panel);
border-radius:14px;padding:6px 8px;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nav button,.nav a{font:inherit;font-size:1.05rem;font-weight:700;color:var(--text);background:transparent;border:2px solid var(--line);
border-radius:10px;padding:6px 12px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.nav button:hover,.nav a:hover{background:var(--panel2)}
.nav #next{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
.nav svg{width:20px;height:20px}
.dots{display:flex;gap:6px}
.dots button{width:10px;height:10px;min-height:0;border-radius:50%;background:rgba(216,212,196,.35);border:0;padding:0}
.dots button.on{background:var(--yellow)}
.pg{font-size:1rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.svep{display:none}
#las{display:none}
html:not([data-visa="1"]) body>*{display:none!important}
html:not([data-visa="1"]) body>#las{display:flex!important;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px}
#las h1{font-size:2rem}#las p{font-size:1.3rem;color:var(--muted);margin:8px 0 22px}
#las a{display:inline-flex;align-items:center;min-height:52px;padding:10px 20px;border-radius:12px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:1.2rem;text-decoration:none}
@media (max-width:760px){
.legend{display:none}
.cap{left:10px;right:10px;top:10px;width:auto;padding:10px 14px 10px;border-radius:12px}
.eyebrow{font-size:.72rem}
.cap h1{font-size:1.45rem}
.num{font-size:1.9rem}
.what{font-size:1.05rem}
.cap p{font-size:1rem;margin-top:4px}
.nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:48px 48px 1fr 1.6fr;gap:6px;padding:6px}
.nav .dots{display:none}
.nav button,.nav a{min-height:48px;padding:4px 6px}
.nav .lang{display:none}
.kort{left:10px;right:10px;top:auto;bottom:calc(76px + env(safe-area-inset-bottom));width:auto;max-height:calc(66vh - 92px);padding:18px 18px 16px;
border-radius:14px;transform:translateY(30px)}
.kort.on{transform:translateY(0)}
.kort h2{font-size:1.5rem}
.kort .ingress{font-size:1.05rem;margin-bottom:12px}
.kort ol{gap:8px;margin-bottom:14px}
.kort ol li{font-size:1.12rem;padding-left:40px}
.kort ol li::before{width:28px;height:28px;font-size:.9rem}
.kort .utover li{font-size:1.05rem}
.kort .roller{grid-template-columns:1fr;gap:8px}
.kort .roll{padding:10px 12px}
.kort .roll p{font-size:1rem}
.svep{display:block;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1;
background:rgba(31,42,32,.85);color:var(--text);font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:999px;pointer-events:none;
opacity:0;transition:opacity .4s ease}
.svep.on{opacity:1}
}
</style>
</head>
